<app-navbar></app-navbar>

<section class="register section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow-lg">
      <!-- Header -->
      <div class="card-header">
        <div class="text-center">
          <h2 class="mb-1">
            <i class="bi bi-shield-lock me-2"></i>Set Your Password
          </h2>
          <p class="mb-0">Create a secure password to activate your account</p>
        </div>
      </div>

      <!-- Body -->
      <div class="card-body">

        <!-- Error -->
        <div *ngIf="errorMessage" class="alert alert-danger">
          <i class="bi bi-exclamation-circle me-2"></i>{{ errorMessage }}
        </div>

        <!-- Success -->
        <div *ngIf="successMessage" class="alert alert-success">
          <i class="bi bi-check-circle me-2"></i>{{ successMessage }}
        </div>

        <form (ngSubmit)="onSubmit()">

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">New Password *</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock"></i>
              </span>
              <input
                type="password"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                required
                placeholder="Enter new password"
              />
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-4">
            <label class="form-label">Confirm Password *</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>
              <input
                type="password"
                class="form-control"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                required
                placeholder="Confirm password"
              />
            </div>
          </div>

          <!-- Submit -->
          <div class="d-flex justify-content-between mt-4">
            <div></div>

            <button type="submit" class="btn btn-primary" [disabled]="isLoading">
              <span *ngIf="!isLoading">
                <i class="bi bi-check-circle me-2"></i>Set Password
              </span>
              <span *ngIf="isLoading">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Saving...
              </span>
            </button>
          </div>

        </form>

        <hr class="my-4" />

        <div class="text-center account-cta">
          <p class="mb-0">
            Back to
            <a routerLink="/auth/login" class="fw-bold">Login</a>
          </p>
        </div>

      </div>
    </div>
  </div>
</div>

  </div>
</section>
